<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cashier Loyalty Portal</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!-- HTML5 QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      overflow: hidden;
      width: 100%;
      max-width: 480px;
    }

    .card-header-custom {
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    .btn-primary-custom {
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-primary-custom:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4);
    }

    #reader {
      border-radius: 15px !important;
      overflow: hidden;
      border: 2px dashed #3b82f6 !important;
      background: #0f172a;
    }

    #reader video {
      border-radius: 12px;
    }

    .customer-card {
      background: #f8fafc;
      border-left: 5px solid #10b981;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .points-badge {
      background: #ef4444;
      color: white;
      font-size: 1.2rem;
      padding: 5px 15px;
      border-radius: 20px;
    }

    .form-control {
      border-radius: 10px;
      padding: 12px;
      border: 1px solid #cbd5e1;
    }

    .form-control:focus {
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
      border-color: #3b82f6;
    }
  </style>
</head>
<body class="p-3">

  <div class="main-card my-auto">
    
    <!-- LOGIN AREA -->
    <div id="loginArea">
      <div class="card-header-custom">
        <i class="fa-solid fa-user-shield fa-3x mb-2"></i>
        <h4 class="fw-bold mb-0">Cashier Portal</h4>
        <small class="text-white-50">Please login to process points</small>
      </div>

      <div class="p-4">
        <div class="mb-3">
          <label class="form-label text-secondary fw-semibold">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
            <input type="text" id="user" class="form-control" placeholder="Enter username">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label text-secondary fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
            <input type="password" id="pass" class="form-control" placeholder="Enter password">
          </div>
        </div>

        <button onclick="login()" class="btn btn-primary-custom w-100 text-white" id="loginBtn">
          <i class="fa-solid fa-right-to-bracket me-2"></i>Login
        </button>
      </div>
    </div>

    <!-- MAIN DASHBOARD AREA -->
    <div id="mainArea" style="display:none;">
      <div class="card-header-custom d-flex justify-content-between align-items-center py-3">
        <div class="text-start">
          <h5 class="fw-bold mb-0">Scan QR Code</h5>
          <small class="text-white-50">Point Reward System</small>
        </div>
        <button onclick="location.reload()" class="btn btn-sm btn-outline-light rounded-pill">
          <i class="fa-solid fa-power-off"></i>
        </button>
      </div>

      <div class="p-4">
        <!-- QR Camera Frame -->
        <div id="reader" class="mb-3"></div>

        <div class="mb-3">
          <label class="form-label text-secondary fw-semibold">Customer NIC Number</label>
          <div class="input-group">
            <input type="text" id="scannedNic" class="form-control" placeholder="Scanned NIC / Manual Entry">
            <button onclick="searchCustomer()" class="btn btn-dark px-3" id="findBtn">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </div>
        </div>

        <!-- Customer Details Card -->
        <div id="customerDetails" style="display:none;" class="customer-card p-3 mb-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div>
              <small class="text-muted d-block">Customer Name</small>
              <h6 class="fw-bold text-dark mb-0" id="cName">-</h6>
            </div>
            <div class="text-end">
              <small class="text-muted d-block">Current Points</small>
              <span id="cPoints" class="points-badge fw-bold">0</span>
            </div>
          </div>

          <hr class="my-2">

          <label class="form-label text-secondary fw-semibold mt-2">Add New Points</label>
          <div class="input-group">
            <input type="number" id="pointsToAdd" class="form-control" placeholder="Amount">
            <button onclick="addPoints()" class="btn btn-success fw-bold px-3" id="addBtn">
              <i class="fa-solid fa-plus me-1"></i> Add
            </button>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    // ⚠️ ඔයාගේ GOOGLE APPS SCRIPT WEB APP URL එක මෙතනට දාන්න (අගට /exec තියෙන්න ඕන)
    const API_URL = "https://script.google.com/macros/s/AKfycbzlvRdso5M6_Cbt7Ygn6qxEEaxADnWbao_KZkcKy5kvVEu9dvX-ouk81DLtefgLhjWe/exec"; 
    let html5QrcodeScanner;

    function handleLoginResponse(res) {
      document.getElementById('loginBtn').innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i>Login';
      if(res.success) {
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('mainArea').style.display = 'block';
        startScanner();
      } else {
        alert("Login Failed! Username හෝ Password වැරදියි.");
      }
    }

    function handleCustomerResponse(res) {
      document.getElementById('findBtn').innerHTML = '<i class="fa-solid fa-magnifying-glass"></i>';
      if(res.success) {
        document.getElementById('cName').innerText = res.name;
        document.getElementById('cPoints').innerText = res.points;
        document.getElementById('customerDetails').style.display = 'block';
      } else {
        alert(res.message);
        document.getElementById('customerDetails').style.display = 'none';
      }
    }

    function handleAddPointsResponse(res) {
      document.getElementById('addBtn').innerHTML = '<i class="fa-solid fa-plus me-1"></i> Add';
      if(res.success) {
        alert("Points සාර්ථකව එකතු කලා!");
        document.getElementById('cPoints').innerText = res.newPoints;
        document.getElementById('pointsToAdd').value = '';
      } else {
        alert("Points එකතු කිරීම අසාර්ථකයි.");
      }
    }

    function sendRequest(url, callbackName) {
      let script = document.createElement('script');
      script.src = url + "&callback=" + callbackName + "&ts=" + new Date().getTime();
      document.body.appendChild(script);
      document.body.removeChild(script);
    }

    function login() {
      var u = document.getElementById('user').value;
      var p = document.getElementById('pass').value;
      if(!u || !p) return alert("Username සහ Password ඇතුලත් කරන්න!");
      
      document.getElementById('loginBtn').innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Connecting...';
      var url = API_URL + "?action=checkLogin&username=" + encodeURIComponent(u) + "&password=" + encodeURIComponent(p) + "&role=cashier";
      sendRequest(url, "handleLoginResponse");
    }

    function startScanner() {
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 220, height: 220} });
      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    function onScanSuccess(decodedText) {
      document.getElementById('scannedNic').value = decodedText;
      searchCustomer();
    }
    
    function onScanFailure(error) { }

    function searchCustomer() {
      var nic = document.getElementById('scannedNic').value;
      if(!nic) return alert("NIC එක ඇතුලත් කරන්න!");
      
      document.getElementById('findBtn').innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
      var url = API_URL + "?action=getCustomerDetails&nic=" + encodeURIComponent(nic);
      sendRequest(url, "handleCustomerResponse");
    }

    function addPoints() {
      var nic = document.getElementById('scannedNic').value;
      var pts = document.getElementById('pointsToAdd').value;
      if(!pts) return alert("Points ඇතුලත් කරන්න!");

      document.getElementById('addBtn').innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
      var url = API_URL + "?action=addPoints&nic=" + encodeURIComponent(nic) + "&pointsToAdd=" + encodeURIComponent(pts);
      sendRequest(url, "handleAddPointsResponse");
    }
  </script>
</body>
</html>
