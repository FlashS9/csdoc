
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.screen { display: none; }
.screen.active { display: block; }
.app-wrap { max-width: 420px; margin: 0 auto; padding: 1rem; }

.login-card {
  background: var(--surface-2);
  border: 0.5px solid var(--border);
  border-radius: 16px;
  padding: 2rem 1.75rem;
  margin-top: 2rem;
}
.brand-mark {
  width: 48px; height: 48px; border-radius: 12px;
  background: var(--fill-accent);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1.25rem;
  color: var(--on-accent);
  font-size: 22px;
}
.login-title { text-align: center; font-size: 18px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; }
.login-sub { text-align: center; font-size: 13px; color: var(--text-secondary); margin-bottom: 1.5rem; }

.field-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.25rem; }
.field-wrap { position: relative; }
.field-wrap i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--text-muted); pointer-events: none; }
.field-wrap input { width: 100%; padding: 10px 12px 10px 36px; border: 0.5px solid var(--border-strong); border-radius: var(--radius); background: var(--surface-1); color: var(--text-primary); font-size: 14px; }
.field-wrap input:focus { outline: none; border-color: var(--border-accent); box-shadow: 0 0 0 2px var(--bg-accent); }

.btn-primary {
  width: 100%; padding: 10px; border-radius: var(--radius); border: none;
  background: var(--fill-accent); color: var(--on-accent);
  font-size: 14px; font-weight: 500; cursor: pointer;
}
.btn-primary:hover { background: var(--fill-accent-hover); }

.dash-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; margin-bottom: 1rem;
  border-bottom: 0.5px solid var(--border);
}
.dash-title { font-size: 16px; font-weight: 500; color: var(--text-primary); }
.dash-badge {
  font-size: 12px; padding: 3px 10px; border-radius: 20px;
  background: var(--bg-success); color: var(--text-success);
  border: 0.5px solid var(--border-success);
}

.scanner-box {
  background: #0f172a;
  border-radius: 12px;
  aspect-ratio: 4/3;
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden; margin-bottom: 1rem;
}
.scan-corner { position: absolute; width: 24px; height: 24px; border-color: #38bdf8; border-style: solid; }
.sc-tl { top: 20px; left: 20px; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
.sc-tr { top: 20px; right: 20px; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
.sc-bl { bottom: 20px; left: 20px; border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
.sc-br { bottom: 20px; right: 20px; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }
.scan-line { position: absolute; left: 20px; right: 20px; height: 2px; background: linear-gradient(90deg, transparent, #38bdf8, transparent); animation: scanMove 2s ease-in-out infinite; top: 40px; }
@keyframes scanMove { 0%,100%{top:25px} 50%{bottom:25px; top:auto} }
.scan-icon { color: #64748b; text-align: center; }
.scan-icon i { font-size: 48px; display: block; margin-bottom: 8px; }
.scan-icon p { font-size: 13px; color: #94a3b8; }

.search-row { display: flex; gap: 8px; margin-bottom: 1rem; }
.search-row input { flex: 1; padding: 10px 12px; border: 0.5px solid var(--border-strong); border-radius: var(--radius); background: var(--surface-1); color: var(--text-primary); font-size: 14px; }
.search-row input:focus { outline: none; border-color: var(--border-accent); }
.btn-search { padding: 10px 16px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: var(--surface-1); color: var(--text-primary); font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn-search:hover { background: var(--surface-0); }

.customer-card {
  background: var(--surface-2); border: 0.5px solid var(--border);
  border-radius: 12px; overflow: hidden;
}
.cust-header { background: var(--bg-accent); border-bottom: 0.5px solid var(--border-accent); padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.cust-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--fill-accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; flex-shrink: 0; }
.cust-name { font-size: 15px; font-weight: 500; color: var(--text-accent); }
.cust-nic { font-size: 12px; color: var(--text-accent); opacity: 0.75; }
.points-row { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 0.5px solid var(--border); }
.points-label { font-size: 13px; color: var(--text-secondary); }
.points-value { font-size: 24px; font-weight: 500; color: var(--text-primary); }
.points-unit { font-size: 13px; color: var(--text-muted); margin-left: 4px; }
.add-row { padding: 14px 16px; display: flex; gap: 8px; align-items: center; }
.add-row input { flex: 1; padding: 9px 12px; border: 0.5px solid var(--border-strong); border-radius: var(--radius); background: var(--surface-1); color: var(--text-primary); font-size: 14px; }
.add-row input:focus { outline: none; border-color: var(--border-accent); }
.btn-add { padding: 9px 18px; border-radius: var(--radius); border: none; background: var(--fill-accent); color: var(--on-accent); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn-add:hover { background: var(--fill-accent-hover); }

.logout-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 4px; }
.logout-btn:hover { color: var(--text-danger); }
</style>

<div class="app-wrap">
  <h2 class="sr-only">Cashier QR scanner application — login and dashboard</h2>

  <!-- Login Screen -->
  <div class="screen active" id="loginScreen">
    <div class="login-card">
      <div class="brand-mark"><i class="ti ti-qrcode" aria-hidden="true"></i></div>
      <p class="login-title">Cashier portal</p>
      <p class="login-sub">Sign in to your cashier account</p>
      <div class="field-group">
        <div class="field-wrap">
          <i class="ti ti-user" aria-hidden="true"></i>
          <input type="text" placeholder="Username" id="usernameInput" />
        </div>
        <div class="field-wrap">
          <i class="ti ti-lock" aria-hidden="true"></i>
          <input type="password" placeholder="Password" id="passwordInput" />
        </div>
      </div>
      <button class="btn-primary" onclick="goToDash()">Sign in</button>
    </div>
  </div>

  <!-- Dashboard Screen -->
  <div class="screen" id="dashScreen">
    <div class="dash-header">
      <div>
        <p class="dash-title">Cashier dashboard</p>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="dash-badge"><i class="ti ti-circle-check" style="font-size:11px;vertical-align:1px" aria-hidden="true"></i> Online</span>
        <button class="logout-btn" onclick="goToLogin()"><i class="ti ti-logout" aria-hidden="true"></i> Sign out</button>
      </div>
    </div>

    <!-- Scanner -->
    <div class="scanner-box">
      <div class="scan-corner sc-tl"></div>
      <div class="scan-corner sc-tr"></div>
      <div class="scan-corner sc-bl"></div>
      <div class="scan-corner sc-br"></div>
      <div class="scan-line"></div>
      <div class="scan-icon">
        <i class="ti ti-scan" aria-hidden="true"></i>
        <p>Point camera at QR code</p>
      </div>
    </div>

    <!-- Manual Search -->
    <div class="search-row">
      <input type="text" placeholder="Enter NIC manually…" id="nicInput" />
      <button class="btn-search" onclick="showCustomer()"><i class="ti ti-search" style="font-size:14px;vertical-align:-1px" aria-hidden="true"></i> Find</button>
    </div>

    <!-- Customer Card (hidden initially) -->
    <div class="customer-card" id="custCard" style="display:none">
      <div class="cust-header">
        <div class="cust-avatar" id="custInitials">SR</div>
        <div>
          <p class="cust-name" id="custName">Saman Rathnayake</p>
          <p class="cust-nic" id="custNic">NIC: 198812345678</p>
        </div>
      </div>
      <div class="points-row">
        <span class="points-label"><i class="ti ti-trophy" style="font-size:15px;vertical-align:-2px;margin-right:5px" aria-hidden="true"></i>Current points</span>
        <div>
          <span class="points-value" id="custPoints">1,240</span>
          <span class="points-unit">pts</span>
        </div>
      </div>
      <div class="add-row">
        <input type="number" placeholder="Points to add…" id="pointsInput" min="0" step="1" />
        <button class="btn-add" onclick="addPts()"><i class="ti ti-plus" style="font-size:14px;vertical-align:-1px" aria-hidden="true"></i> Add</button>
      </div>
    </div>
  </div>
</div>

<script>
function goToDash() {
  const u = document.getElementById('usernameInput').value;
  const p = document.getElementById('passwordInput').value;
  if (!u || !p) { alert('Enter username and password.'); return; }
  document.getElementById('loginScreen').classList.remove('active');
  document.getElementById('dashScreen').classList.add('active');
}
function goToLogin() {
  document.getElementById('dashScreen').classList.remove('active');
  document.getElementById('loginScreen').classList.add('active');
  document.getElementById('custCard').style.display = 'none';
}
function showCustomer() {
  const nic = document.getElementById('nicInput').value;
  if (!nic) { alert('Enter a NIC number.'); return; }
  document.getElementById('custNic').textContent = 'NIC: ' + nic;
  document.getElementById('custCard').style.display = 'block';
}
function addPts() {
  const pts = parseInt(document.getElementById('pointsInput').value) || 0;
  if (!pts) { alert('Enter points to add.'); return; }
  const cur = parseInt(document.getElementById('custPoints').textContent.replace(/,/g, '')) || 0;
  document.getElementById('custPoints').textContent = (cur + pts).toLocaleString();
  document.getElementById('pointsInput').value = '';
}
</script>
